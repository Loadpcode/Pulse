name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build and test
        run: |
          set -o pipefail
          gradle assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Upload APK to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1)
          if [ -n "${FILE}" ]; then
            gh release view debug-apk >/dev/null 2>&1 || gh release create debug-apk --title "Debug APK (latest)" --notes "Автоматическая debug-сборка последнего коммита main"
            gh release upload debug-apk "${FILE}" --clobber
          fi

      - name: Report run result to issues
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8').split('\n').slice(-120).join('\n'); } catch (e) {}
            let status = '';
            try {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId });
              status = jobs.data.jobs.map(j => {
                const bad = j.steps.filter(s => s.conclusion === 'failure' || s.conclusion === 'cancelled').map(s => s.name);
                return j.name + ': ' + j.conclusion + (bad.length ? ' (упавшие шаги: ' + bad.join(', ') + ')' : '');
              }).join('\n');
            } catch (e) { status = 'не удалось получить статусы: ' + e.message; }
            const failed = /failure|cancelled|timed.out/i.test(status) && !/build > Report run result/.test('') ;
            const isFailed = (await (async () => /: (failure|cancelled)/.test(status))());
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: (isFailed ? 'CI failure on ' : 'CI success on ') + context.sha.slice(0, 8),
              body: 'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo
                + '/actions/runs/' + context.runId
                + '\n\nСтатусы шагов:\n' + status
                + '\n\nХвост лога Gradle:\n\n```\n' + log + '\n```'
            });
