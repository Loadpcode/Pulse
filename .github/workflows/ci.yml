name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1
        continue-on-error: true

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and test
        run: |
          if gradle assembleDebug testDebugUnitTest --stacktrace 2>&1 | tee build.log; then
            echo "BUILD_FAILED=false" >> "$GITHUB_ENV"
          else
            echo "BUILD_FAILED=true" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Upload APK to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1)
          if [ -n "${FILE}" ] && [ "${{ env.BUILD_FAILED }}" != "true" ]; then
            gh release view debug-apk >/dev/null 2>&1 || gh release create debug-apk --title "Debug APK (latest)" --notes "Автоматическая debug-сборка последнего коммита main"
            BASE=$(basename "${FILE}")
          for attempt in 1 2 3 4; do
            if gh release upload debug-apk "${FILE}" --clobber; then
              echo "PUBLISH_FAILED=false" >> "$GITHUB_ENV"
              exit 0
            fi
            # HTTP 500 can leave a broken partial asset: delete it before retry
            gh release delete-asset debug-apk "${BASE}" -y >/dev/null 2>&1 || true
            sleep 15
          done
          echo "PUBLISH_FAILED=true" >> "$GITHUB_ENV"
          exit 1
          fi

      - name: Report run result to issues
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8').split('\n').slice(-120).join('\n'); } catch (e) {}
            const buildFailed = '${{ env.BUILD_FAILED }}' === 'true';
            const publishFailed = '${{ env.PUBLISH_FAILED }}' === 'true';
            const isFailed = buildFailed || publishFailed;
            const verdict = buildFailed ? 'сборка/тесты упали' : (publishFailed ? 'сборка прошла, публикация APK упала' : 'всё успешно');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: (isFailed ? 'CI failure on ' : 'CI success on ') + context.sha.slice(0, 8),
              body: 'Итог: ' + verdict
                + '\nRun: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo
                + '/actions/runs/' + context.runId
                + '\nRelease: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/releases/tag/debug-apk'
                + '\n\nХвост лога Gradle:\n\n```\n' + log + '\n```'
            });
